name: IC Club 5-Category News Notifier

on:
  schedule:
    # 30分おき。notify.yml(0分・30分)とcron時刻を意図的にずらしている
    # (同一リポジトリで同時刻に複数scheduleがあるとGitHub側で競合しやすいため)
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # ★2026-07-30 統一: pushする4本を同一groupにして「同時に走らせない」
  #   別groupだと同時実行→git pushがnon-fast-forwardで衝突→job failure→メール通知
  #   同一groupなら順番待ちになるので衝突そのものが発生しない
  group: discord-rss-notifier-repo-write
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ★2026-09-06 追加（AIラボ側で2026-09-05に実測して確定した対策と同じ）。
          #   actions/checkout は既定で github.sha＝runが【作成】された時点のSHAを取る。
          #   concurrencyで順番待ちしている間に他のworkflowがpushすると、
          #   待たされたrunは古いSHAをcheckout→detached HEADになり
          #   "fatal: You are not currently on a branch." でgit pushが死ぬ。
          #   するとseenが保存されず、数時間後に同じ記事がもう一度流れる。
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run IC club notifier
        env:
          DISCORD_WEBHOOK_TOPIC1: ${{ secrets.DISCORD_WEBHOOK_TOPIC1 }}
          DISCORD_WEBHOOK_TOPIC2: ${{ secrets.DISCORD_WEBHOOK_TOPIC2 }}
          DISCORD_WEBHOOK_TOPIC3: ${{ secrets.DISCORD_WEBHOOK_TOPIC3 }}
          DISCORD_WEBHOOK_TOPIC4: ${{ secrets.DISCORD_WEBHOOK_TOPIC4 }}
          DISCORD_WEBHOOK_TOPIC5: ${{ secrets.DISCORD_WEBHOOK_TOPIC5 }}
        run: python ic_club_notifier.py

      - name: Commit updated ic_club_seen_urls.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ic_club_seen_urls.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update ic_club_seen_urls.json"
          # 同一リポジトリに4本のworkflowがpushするため衝突する。
          # pull --rebase してから最大3回リトライ(market_notify.ymlと同じ方式)
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push && break
            echo "Push retry $i"
            sleep 3
          done
