name: Discord RSS Notifier

on:
  schedule:
    # 30分おき。GitHub Actionsのcronは負荷状況で数分ずれることがあるが
    # RSS通知の用途では問題にならない
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # Actionsタブから手動実行もできるようにしておく

# seen_urls.jsonをコミットし直すのでpush権限が必要
permissions:
  contents: write

concurrency:
  # ★2026-07-30 統一: pushする4本を同一groupにして「同時に走らせない」
  #   別groupだと同時実行→git pushがnon-fast-forwardで衝突→job failure→メール通知
  #   同一groupなら順番待ちになるので衝突そのものが発生しない
  group: discord-rss-notifier-repo-write
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notifier.py

      - name: Commit updated seen_urls.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update seen_urls.json"
          # 同一リポジトリに4本のworkflowがpushするため衝突する。
          # pull --rebase してから最大3回リトライ(market_notify.ymlと同じ方式)
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push && break
            echo "Push retry $i"
            sleep 3
          done
