name: AI Lab Bridge trigger ailab-news-bot

on:
  # 既存workflow衝突回避: IC倶楽部(5,35) / market_notify(25,55・8,38) / crypto_bridge(4,14,24,34,44,54) と 11,41 でずらす
  schedule:
    - cron: "11,41 * * * *"
    - cron: "0 */3 * * *"        # 冗長(3時間毎の最終保険・market_notifyの冗長2に倣う)
  workflow_dispatch:
  # ★生きているschedulerに便乗発火。
  #   AIラボ本体を ailab-news-bot へ分離した結果、Layer1(自前cron)もLayer3(kurenai-market-trigger)も
  #   GitHub側のschedule間引きで停止し、2026-09-03に7時間配信が止まった。
  #   IC倶楽部/金融市場Botは同時刻帯にschedule実績があるため、その完了に便乗して押す。
  #   ★2026-09-03 実測: crypto_bridge(10分毎cron＋便乗=当リポ最頻出)への便乗は【過剰】だった。
  #     bridgeが 18:34:09/18:34:30/18:35:02/18:35:24 と0.3〜0.5分間隔で連発し、
  #     botの1実行(argostranslate導入で3〜5分)が終わる前に次が来て、
  #     concurrency により cancelled が7件連続=一度も配信できない状態になった。
  #     便乗先は IC倶楽部(cron 5,35=30分毎) と 金融市場Bot(25,55・8,38=15分毎) に絞る。
  #     → 15〜30分に1回＝1実行の所要時間に対して適切な間隔。冗長性は保ちつつ過剰だけ削る。
  #   ★★片方向厳守: crypto_bridge 側の workflow_run に本workflowを足すと
  #     ailab_bridge ⇄ crypto_bridge の無限ループになりActions枠を食い潰す。絶対に足さない。
  workflow_run:
    workflows:
      - "IC Club 5-Category News Notifier"
      - "金融市場Bot Phase2/3 開示・政策・SEC速報"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ailab-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ailab-news-bot
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set +e
          REPO="akatsuki-5648/ailab-news-bot"
          for wf in ailab_news_notify.yml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            echo "ailab-bridge [$code] $wf"
            sleep 2
          done
